<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">DC-DC Boost Converter Circuit Diagram</title><desc id="desc">Standard boost converter showing input source, inductor, MOSFET, diode, capacitor and resistive load.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
<style>.w{stroke:#172033;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.c{stroke:#172033;stroke-width:4;fill:#fff}.l{font:600 25px Arial,sans-serif;fill:#172033}.s{font:20px Arial,sans-serif;fill:#4b5563}.p{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#arrow)}</style>
<rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" class="l" font-size="32">DC–DC BOOST CONVERTER</text>
<!-- source --><circle cx="120" cy="300" r="55" class="c"/><line x1="120" y1="245" x2="120" y2="275" class="w"/><line x1="120" y1="325" x2="120" y2="355" class="w"/><text x="120" y="288" text-anchor="middle" class="l">+</text><text x="120" y="328" text-anchor="middle" class="l">−</text><text x="120" y="405" text-anchor="middle" class="l">Vin</text><text x="120" y="435" text-anchor="middle" class="s">DC source</text>
<!-- inductor --><line x1="175" y1="300" x2="235" y2="300" class="w"/><path d="M235 300 C235 260 270 260 270 300 C270 260 305 260 305 300 C305 260 340 260 340 300 C340 260 375 260 375 300" class="w"/><line x1="375" y1="300" x2="455" y2="300" class="w"/><text x="305" y="230" text-anchor="middle" class="l">L</text><text x="305" y="260" text-anchor="middle" class="s">Inductor</text>
<!-- mosfet --><line x1="455" y1="300" x2="455" y2="380" class="w"/><line x1="420" y1="380" x2="490" y2="380" class="w"/><line x1="430" y1="350" x2="430" y2="410" class="w"/><line x1="455" y1="350" x2="455" y2="410" class="w"/><line x1="430" y1="365" x2="390" y2="365" class="w"/><line x1="455" y1="410" x2="455" y2="500" class="w"/><text x="365" y="350" text-anchor="end" class="l">Gate / PWM</text><text x="455" y="455" text-anchor="middle" class="l">MOSFET</text><text x="455" y="485" text-anchor="middle" class="s">Switch</text>
<!-- diode --><line x1="455" y1="300" x2="570" y2="300" class="w"/><polygon points="570,270 570,330 625,300" class="c"/><line x1="635" y1="265" x2="635" y2="335" class="w"/><line x1="635" y1="300" x2="740" y2="300" class="w"/><text x="600" y="230" text-anchor="middle" class="l">D</text><text x="600" y="260" text-anchor="middle" class="s">Diode</text>
<!-- capacitor --><line x1="740" y1="300" x2="740" y2="365" class="w"/><line x1="700" y1="365" x2="780" y2="365" class="w"/><line x1="700" y1="390" x2="780" y2="390" class="w"/><line x1="740" y1="390" x2="740" y2="500" class="w"/><text x="805" y="385" class="l">C</text><text x="805" y="415" class="s">Output capacitor</text>
<!-- load --><line x1="900" y1="300" x2="900" y2="350" class="w"/><path d="M880 350 L920 365 L880 380 L920 395 L880 410 L920 425 L880 440" class="w"/><line x1="900" y1="440" x2="900" y2="500" class="w"/><text x="950" y="395" class="l">Rload</text><text x="950" y="425" class="s">Load</text>
<!-- rails --><line x1="740" y1="300" x2="900" y2="300" class="w"/><line x1="900" y1="500" x2="455" y2="500" class="w"/><line x1="175" y1="300" x2="175" y2="500" class="w"/><line x1="175" y1="500" x2="120" y2="500" class="w"/><line x1="120" y1="355" x2="120" y2="500" class="w"/>
<!-- ground --><line x1="455" y1="500" x2="455" y2="525" class="w"/><line x1="425" y1="525" x2="485" y2="525" class="w"/><line x1="435" y1="540" x2="475" y2="540" class="w"/><line x1="445" y1="555" x2="465" y2="555" class="w"/><text x="500" y="545" class="s">Common return / GND</text>
<!-- arrows --><path d="M205 285 L400 285" class="p"/><text x="300" y="115" text-anchor="middle" class="l">Inductor energy storage</text><path d="M660 285 L860 285" class="p"/><text x="760" y="115" text-anchor="middle" class="l">Energy to output</text><text x="1040" y="290" class="l">Vout</text><text x="1040" y="320" class="s">Boosted DC output</text>
</svg>
